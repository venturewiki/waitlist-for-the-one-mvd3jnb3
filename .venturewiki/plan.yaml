fundingAsk:
  totalRaise: TBD
  instrument: Bootstrapped
  valuationCapTerms: N/A
  targetCloseDate: TBD
  askOneLiner: Build the NYC MVP of an AI matchmaker where every match has to end in a real meeting.
  useOfFunds: []
  elevatorPitch:
    hook: Dating apps sell endless swiping, and only 1 in 10 couples met online.
    companyIntro: 'Waitlist for The One: tell an AI who you want, and we tell you when that person exists.'
    tractionProof: Pre-launch. Requirements come from a 3-hour founders' call
    marketSize: 117.6M unmarried US adults; Hinge alone earns $691M/yr on intent-driven dating
    askAndUse: Build the MVP and launch the NYC waitlist
    cta: Join the waitlist
  risks:
    - risk: Liquidity / cold start
      likelihood: high
      impact: high
      mitigation: Launch in one city; design the waitlist so waiting feels intentional
    - risk: Known and Sitch move first
      likelihood: high
      impact: medium
      mitigation: Speed to NYC; meet-to-unlock mechanic as the moat
    - risk: Safety without chat
      likelihood: medium
      impact: high
      mitigation: Verified identities, public venues only, share-your-date, easy reporting
    - risk: Check-in disputes
      likelihood: medium
      impact: medium
      mitigation: Two-sided QR check-in + feedback history + human dispute path
    - risk: App-store fees and rules
      likelihood: high
      impact: medium
      mitigation: In-app purchase for unlocks (15–30% fee); reporting, blocking and moderation built in
    - risk: Deceptive counts or reviews
      likelihood: low
      impact: high
      mitigation: Real counts and real reviews only (the FTC banned fake reviews in 2024)
